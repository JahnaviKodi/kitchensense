[project]
name = "kitchensense"
version = "0.1.0"
description = "An autonomous agent that reduces household food waste"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  # 2.0.28 introduced postgresql_nulls_not_distinct, which the snapshot's lot
  # key needs because printed_date is legitimately NULL.
  "sqlalchemy>=2.0.30",
  "asyncpg",
  "alembic",
  # Reading the PostgreSQL connection string from Key Vault with the
  # container app's user-assigned managed identity.
  "azure-identity",
  "azure-keyvault-secrets",
  # Validating Entra External ID access tokens. The crypto extra pulls in
  # `cryptography`, without which PyJWT cannot verify an RS256 signature —
  # and, worse, would not obviously fail to.
  "pyjwt[crypto]>=2.9",
  # Fetching the tenant's OpenID configuration and signing keys.
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "mypy",
  "hypothesis",
  "testcontainers[postgres]",
  # Only for the container's readiness probe and Alembic's sync paths;
  # the application itself talks asyncpg.
  "psycopg[binary]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchensense"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
  "postgres: needs a real Postgres, started via testcontainers (skipped without Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `alembic/` at the repository root makes ruff read the installed `alembic`
# package as first-party, which shuffles migration imports on every run.
known-third-party = ["alembic"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["docs", ".venv"]